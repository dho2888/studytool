
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>中國發展與全球人口 - iPad 線上問答遊戲</title>
    <style>
        /* 基礎樣式與 iPad 適配 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            background-color: #f0f3f5;
            color: #2c3e50;
            line-height: 1.6;
            margin: 0;
            padding: 20px 15px;
            /* 防止 iOS 長按選取文字 */
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            max-width: 768px; /* 完美契合 iPad 寬度 */
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 1.6em;
            margin-top: 5px;
            margin-bottom: 25px;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
        }
        .progress-bar {
            font-size: 0.95em;
            color: #7f8c8d;
            text-align: right;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .question-text {
            font-size: 1.25em;
            font-weight: bold;
            margin-bottom: 25px;
            color: #2c3e50;
            line-height: 1.5;
            /* 允許題目文字被看見，但依然不允許選取 */
            -webkit-user-select: text;
            user-select: text;
        }
        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
            margin-bottom: 25px;
        }
        .option-btn {
            background-color: #fff;
            border: 2px solid #dcdde1;
            padding: 16px 20px;
            border-radius: 10px;
            font-size: 1.05em;
            cursor: pointer;
            text-align: left;
            color: #2c3e50;
            transition: background-color 0.1s ease, border-color 0.1s ease;
            /* 移除 iOS 點擊時的灰色高亮陰影 */
            -webkit-tap-highlight-color: transparent;
            /* 優化觸控響應速度 */
            touch-action: manipulation;
        }
        /* iPad 觸控按下時的即時反饋 */
        .option-btn:active:not(:disabled) {
            background-color: #f1f2f6;
        }
        .option-btn.selected {
            background-color: #3498db !important;
            color: white !important;
            border-color: #2980b9 !important;
        }
        .option-btn:disabled {
            opacity: 0.8;
            color: #7f8c8d;
            background-color: #f5f6fa;
        }
        .action-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            min-height: 55px;
        }
        .msg {
            font-weight: bold;
            font-size: 1.1em;
            padding-right: 10px;
        }
        .msg.correct { color: #2ecc71; }
        .msg.wrong { color: #e74c3c; }
        .msg.retry { color: #f39c12; }

        .next-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1.05em;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            box-shadow: 0 4px 6px rgba(46, 204, 113, 0.2);
        }
        
        /* 結算報告表格樣式（針對 iPad 滾動進行優化） */
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch; /* 讓 iPad 滾動表格時更平滑 */
            margin-top: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px; /* 確保內容不會過度擠壓 */
        }
        th, td {
            border-bottom: 1px solid #ddd;
            padding: 14px 12px;
            text-align: left;
            font-size: 0.95em;
        }
        th {
            background-color: #34495e;
            color: white;
            position: sticky;
            top: 0;
        }
        tr:nth-child(even) { background-color: #f8f9fa; }
        .res-correct { color: #2ecc71; font-weight: bold; }
        .res-wrong { color: #e74c3c; font-weight: bold; }
        
        .score-board {
            text-align: center;
            font-size: 1.4em;
            margin-bottom: 20px;
            background: #e8f8f5;
            padding: 18px;
            border-radius: 10px;
            color: #117864;
            font-weight: bold;
            border: 1px solid #a3e4d7;
        }
        .restart-btn {
            display: block;
            margin: 25px auto 5px;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.05em;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

<div class="container" id="game-box">
    </div>

<script>
// 36 道題目數據庫
const quizData = [
    { q: "1966至1976年間，中國內地發生了____________________，使社會、經濟、文化和教育發展受到嚴重阻礙。", options: ["土地改革運動", "文化大革命", "三反五反運動", "大躍進"], answer: "文化大革命" },
    { q: "文化大革命期間，部分學生到處破壞古蹟和文物，造成____________________上無法彌補的損失。", options: ["文化", "科技", "外交", "經濟"], answer: "文化" },
    { q: "針對文革後物資短缺、民生困苦的局面，當時的中國領導人鄧小平於1978年提出推行「____________________」政策。", options: ["四個現代化", "三面紅旗", "社會主義好", "改革開放"], answer: "改革開放" },
    { q: "改革開放的兩大核心方向是「對內____________________、對外____________________」。", options: ["整頓、交流", "發展、建交", "轉型、招商", "改革、開放"], answer: "改革、開放" },
    { q: "在農村改革方面，政府容許農民在交夠國家規定的糧食後，可以自行____________________剩餘的農作物。", options: ["販賣", "出口", "銷毀", "儲存"], answer: "販賣" },
    { q: "在城市改革方面，工廠由政府管理改為____________________負責，並引進獎賞制度以提升生產力。", options: ["外資", "軍隊", "企業", "社區"], answer: "企業" },
    { q: "1980年代，中國首先開放了五個地區作為對外開放的試點，這些地區被稱為____________________。", options: ["自由貿易港", "沿海開放城市", "經濟特區", "內地直轄市"], answer: "經濟特區" },
    { q: "1980年代設立的五個試點地區包括：深圳、珠海、汕頭、____________________和海南。", options: ["廈門", "廣州", "福州", "上海"], answer: "廈門" },
    { q: "外國商人願意到中國內地投資設廠，主要是原因中國政府給予特殊優惠，向他們徵收較低的____________________。", options: ["地租", "水電費", "稅款", "報關費"], answer: "稅款" },
    { q: "中國內地擁有廉價的____________________和大量的土地，成為吸引外商進駐的極大優勢。", options: ["原材料", "技術人才", "勞工", "運輸工具"], answer: "勞工" },
    { q: "在改革開放過程中，香港扮演了內地與世界之間的____________________角色。", options: ["領導者", "橋樑", "後勤基地", "競爭對手"], answer: "橋樑" },
    { q: "隨著改革開放的推展，世界各地商人紛紛到內地投資，使中國內地逐漸發展成為「____________________」。", options: ["世界工廠", "金融中心", "科技矽谷", "農業大國"], answer: "世界工廠" },
    { q: "中國近年工商業發展蓬勃，人民的每年人均收入普遍增加，____________________也相應提高了。", options: ["儲蓄率", "通脹率", "失業率", "消費力"], answer: "消費力" },
    { q: "近年平均每年約有一千萬名農民從農村走到____________________工作和生活，成為農民工。", options: ["邊疆", "城市", "海外", "漁村"], answer: "城市" },
    { q: "中國現時有二百多種工業產品的產量高居世界第____________________位。", options: ["第一", "二", "三", "四"], answer: "第一" },
    { q: "急速的經濟發展雖然帶來財富，但____________________也引致和環境污染等需要正視的社會問題。", options: ["貧富懸殊", "物價上漲", "糧食短缺", "人口減少"], answer: "物價上漲" },
    { q: "農業科技方面，中國成功研發了雜交____________________，對世界粮食產量作出重大貢獻。", options: ["小麥", "玉米", "水稻", "大豆"], answer: "水稻" },
    { q: "能源科技方面，近年內地大力發展創新綠色出行，例如研發及普及____________________電動車。", options: ["太陽能", "鋰電池", "核能", "氫能源"], answer: "氫能源" },
    { q: "資訊科技方面，中國研發了名為「神威·太湖之光」的____________________，展現強大的計算能力。", options: ["量子通訊衛星", "5G基站", "人工智能晶片", "超級電腦"], answer: "超級電腦" },
    { q: "航空科技方面，中國成功研製了大型噴射式____________________，其型號為C919。", options: ["軍用運輸機", "載人飛船", "無人偵察機", "民航客機"], answer: "民航客機" },
    { q: "中國於2001年正式加入____________________，旨在推動國際貿易活動能自由和平等地進行。", options: ["世界貿易組織", "亞太經濟合作組織", "聯合國安全理事會", "世界銀行"], answer: "世界貿易組織" },
    { q: "由中國發起的____________________正式成立，目的是向亞洲各國和地區政府提供發展基礎建設的資金。", options: ["亞洲開發銀行", "亞洲基礎設施投資銀行", "新開發銀行", "國際貨幣基金組織"], answer: "亞洲基礎設施投資銀行" },
    { q: "2017年，中國在北京舉行國際合作高峰論壇，旨在推動中國與「____________________」沿線各國和地區的經濟合作。", options: ["亞太經合組織", "東盟一體化", "一帶一路", "粵港澳大灣區"], answer: "一帶一路" },
    { q: "認識和關心中國的途徑有很多，例如參觀有關展覽以及閱讀和中國有關的____________________。", options: ["歷史小說", "旅遊指南", "統計年鑑", "新聞"], answer: "新聞" },
    { q: "當今科技進步，醫療技術、環境衛生和糧食生產技術等都得到改善，人們的__________普遍延長。", options: ["退休年齡", "工作時間", "壽命", "受教育年期"], answer: "壽命" },
    { q: "近 60 年來，世界人口增長超過__________倍。", options: ["二", "三", "四", "一"], answer: "一" },
    { q: "2017 年的世界人口已經超過__________。", options: ["50億", "60億", "75億", "90億"], answer: "75億" },
    { q: "全球人口分佈不平均，超過一半的人口居住在__________。", options: ["歐洲", "亞洲", "非洲", "北美洲"], answer: "亞洲" },
    { q: "世界七大洲中，亞洲和__________洲的人口密度較高。", options: ["北美", "非", "歐", "大洋"], answer: "歐" },
    { q: "非洲國家人民的__________觀念較薄弱，普遍認為多子女是福氣，導致出生率非常高。", options: ["優生學", "節育", "男女平等", "晚婚"], answer: "節育" },
    { q: "非洲正面對人口__________問題，引致糧食短缺、醫療和教育服務不足等挑戰。", options: ["老化", "膨脹", "萎縮", "遷移"], answer: "膨脹" },
    { q: "為了減輕人口壓力，非洲各國政府鼓勵人民__________，並加強教育和宣傳。", options: ["計劃生育", "移居海外", "提早退休", "務農發展"], answer: "計劃生育" },
    { q: "日本和香港等已發展國家和地區，由於出生人數減少，長者人口比例持續上升，造成嚴重的__________問題。", options: ["勞動力過剩", "人口老化", "城市過度擁擠", "托兒服務不足"], answer: "人口老化" },
    { q: "人口老化會導致__________人口減少，妨礙社會和經濟發展。", options: ["勞動", "消费", "老年", "學生"], answer: "勞動" },
    { q: "為了維持勞動力，日本逐步把公務員的__________延後。", options: ["工作時數", "年假天數", "入職要求", "退休年齡"], answer: "退休年齡" },
    { q: "香港與世界眾多已發展地區一樣，出現了出生率和死亡率同時__________的現象。", options: ["下降", "上升", "波動", "停滯"], answer: "下降" }
];

let currentIndex = 0;
let attempts = 0;
let correctCount = 0;
let studentRecords = [];

function initGame() {
    currentIndex = 0;
    correctCount = 0;
    studentRecords = [];
    loadQuestion();
}

function loadQuestion() {
    attempts = 0; 
    const currentQuiz = quizData[currentIndex];
    
    let html = `
        <h1>中國發展與全球人口 問答遊戲</h1>
        <div class="progress-bar">進度：${currentIndex + 1} / ${quizData.length}</div>
        <div class="question-text">${currentIndex + 1}. ${currentQuiz.q}</div>
        <div class="options-container">
    `;
    
    const prefixes = ['A', 'B', 'C', 'D'];
    currentQuiz.options.forEach((opt, idx) => {
        html += `<button class="option-btn" onclick="checkAnswer(this, '${opt}')">${prefixes[idx]}. ${opt}</button>`;
    });
    
    html += `
        </div>
        <div class="action-container">
            <div id="feedback-msg" class="msg"></div>
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">下一題</button>
        </div>
    `;
    
    document.getElementById('game-box').innerHTML = html;
    // 確保每次換題都自動捲動到 iPad 頂部
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function checkAnswer(btn, selectedOpt) {
    const currentQuiz = quizData[currentIndex];
    const msgDiv = document.getElementById('feedback-msg');
    const nextBtn = document.getElementById('next-btn');
    const allButtons = document.querySelectorAll('.option-btn');
    
    attempts++;
    
    allButtons.forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');

    if (selectedOpt === currentQuiz.answer) {
        msgDiv.className = "msg correct";
        msgDiv.innerText = "🎉 答對了！";
        correctCount++;
        recordResult(selectedOpt, true);
        allButtons.forEach(b => b.disabled = true);
        nextBtn.style.display = "block";
    } else {
        if (attempts === 1) {
            msgDiv.className = "msg retry";
            msgDiv.innerText = "❌ 答案錯誤，請再試一次！(剩 1 次機會)";
        } else {
            msgDiv.className = "msg wrong";
            msgDiv.innerText = `❌ 依然錯誤。正解：${currentQuiz.answer}`;
            recordResult(selectedOpt, false);
            allButtons.forEach(b => b.disabled = true);
            nextBtn.style.display = "block";
        }
    }
}

function recordResult(studentAns, isCorrect) {
    const currentQuiz = quizData[currentIndex];
    studentRecords.push({
        question: `${currentIndex + 1}. ${currentQuiz.q}`,
        studentAns: studentAns,
        correctAns: currentQuiz.answer,
        status: isCorrect ? "<span class='res-correct'>正確</span>" : "<span class='res-wrong'>錯誤</span>"
    });
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < quizData.length) {
        loadQuestion();
    } else {
        showReport();
    }
}

function showReport() {
    let html = `
        <h1>測試完成！</h1>
        <div class="score-board">
            得分：${correctCount} / ${quizData.length} 題
        </div>
        <h3 style="margin-top:20px;">詳細作答紀錄：</h3>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50%;">題目</th>
                        <th>你的答案</th>
                        <th>正確答案</th>
                        <th>結果</th>
                    </tr>
                </thead>
                <tbody>
    `;
    
    studentRecords.forEach(rec => {
        html += `
            <tr>
                <td style="-webkit-user-select: text; user-select: text;">${rec.question}</td>
                <td>${rec.studentAns}</td>
                <td>${rec.correctAns}</td>
                <td>${rec.status}</td>
            </tr>
        `;
    });
    
    html += `
                </tbody>
            </table>
        </div>
        <button class="restart-btn" onclick="initGame()">重新挑戰</button>
    `;
    
    document.getElementById('game-box').innerHTML = html;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.onload = initGame;
</script>

</body>
</html>

```
